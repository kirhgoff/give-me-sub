# One toolchain for developers, git hooks and CI: `mise install`, then `mise run check`.
[tools]
hk = "2.8.1"
pkl = "0.32.2"
typos = "1.51.1"
swiftlint = "0.65.1"
xcodegen = "2.46.0"
shellcheck = "0.11.0"
betterleaks = "1.9.0"
actionlint = "1.7.12"
zizmor = "1.31.1"
"github:agent-sh/agnix" = "latest"

[tasks.setup]
description = "Install the git hooks"
run = "hk install"

[tasks.lint]
description = "Run every check except the Xcode build and tests"
run = "hk check --all --skip-step xcodebuild_test"

[tasks.check]
description = "Run every check, the same set CI runs"
run = "hk check --all"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"
