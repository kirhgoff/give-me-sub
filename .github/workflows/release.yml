name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: xcode-27
    env:
      APP: build/GiveMeSub.xcarchive/Products/Applications/GiveMeSub.app
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: Scripts/fetch-vendor.sh
      - run: xcodegen generate
      - name: Import certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12" | base64 -d > cert.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12
      - name: Archive
        run: |
          v=${GITHUB_REF_NAME#v}
          xcodebuild archive -project GiveMeSub.xcodeproj -scheme GiveMeSub -configuration Release -archivePath build/GiveMeSub.xcarchive \
            CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="${{ vars.APPLE_TEAM_ID }}" OTHER_CODE_SIGN_FLAGS=--timestamp \
            MARKETING_VERSION="$v" CURRENT_PROJECT_VERSION="$v"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Notarize and staple
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8" | base64 -d > AuthKey.p8
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          rm AuthKey.p8
          xcrun stapler staple "$APP"
          spctl -a -vv -t exec "$APP"
          ditto -c -k --keepParent "$APP" GiveMeSub.zip
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" GiveMeSub.zip --generate-notes
      - uses: actions/checkout@v5
        with:
          repository: kirhgoff/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Bump cask
        run: |
          v=${GITHUB_REF_NAME#v}; s=$(shasum -a 256 GiveMeSub.zip | cut -d' ' -f1)
          sed -i '' -e "s/^  version .*/  version \"$v\"/" -e "s/^  sha256 .*/  sha256 \"$s\"/" tap/Casks/give-me-sub.rb
          git -C tap -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -am "give-me-sub $v"
          git -C tap push
