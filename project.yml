name: GiveMeSub
options:
  bundleIdPrefix: com.kirhgoff
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"
targets:
  GiveMeSub:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Vendor/whistle.cact
        buildPhase: resources
      - path: Vendor/NOTICE
        buildPhase: resources
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirhgoff.givemesub
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/needle
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/needle
        OTHER_LDFLAGS: -lneedle -lc++
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: Sources/App/GiveMeSub.entitlements
      properties:
        com.apple.security.device.audio-input: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSAudioCaptureUsageDescription: Captures system audio to generate live captions.
        CFBundleURLTypes:
          - CFBundleURLName: com.kirhgoff.givemesub
            CFBundleURLSchemes: [givemesub]
  GiveMeSubTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: GiveMeSub
      - sdk: AVFoundation.framework
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GiveMeSub.app/Contents/MacOS/GiveMeSub
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/needle
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GiveMeSub:
    build:
      targets:
        GiveMeSub: all
        GiveMeSubTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GiveMeSubTests
